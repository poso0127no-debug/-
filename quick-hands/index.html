<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e7">
  <title>快手俱樂部 | 反應力挑戰</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f0e7;
      --ink: #20231f;
      --muted: #777970;
      --line: #d5d2c8;
      --lime: #d4ff3f;
      --coral: #ff6548;
      --blue: #415be8;
      --font: "Arial Narrow", "Microsoft JhengHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#20231f18 .75px, transparent .75px);
      background-size: 8px 8px;
      font-family: var(--font);
    }

    button { font: inherit; }

    .page {
      width: min(1120px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px clamp(18px, 4vw, 48px) 28px;
      display: flex;
      flex-direction: column;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 17px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand { display: flex; align-items: center; gap: 9px; }
    .brand-mark { width: 12px; height: 12px; background: var(--coral); transform: rotate(45deg); }
    .edition { color: var(--muted); }

    main { flex: 1; display: flex; flex-direction: column; }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding: 31px 0 22px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .15em;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 68px);
      line-height: .98;
      letter-spacing: -.045em;
    }

    .intro-note {
      max-width: 220px;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border: 1px solid var(--ink);
      background: var(--paper);
    }

    .stat {
      min-height: 83px;
      padding: 14px 18px 12px;
      border-right: 1px solid var(--line);
    }

    .stat:last-child { border-right: 0; }
    .stat-label { display: block; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .12em; }
    .stat-value { display: block; margin-top: 4px; font-size: 31px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
    .stat:last-child .stat-value { color: var(--coral); }

    .arena {
      position: relative;
      flex: 1;
      min-height: 300px;
      max-height: 440px;
      margin-top: 14px;
      overflow: hidden;
      border: 1px solid var(--ink);
      background-color: #e7e4d9;
      background-image: linear-gradient(#20231f0b 1px, transparent 1px), linear-gradient(90deg, #20231f0b 1px, transparent 1px);
      background-size: 32px 32px;
      touch-action: manipulation;
      isolation: isolate;
    }

    .arena::before, .arena::after {
      position: absolute;
      z-index: -1;
      width: 18px;
      height: 18px;
      content: "";
      border-color: var(--ink);
      opacity: .45;
    }
    .arena::before { top: 12px; left: 12px; border-top: 1px solid; border-left: 1px solid; }
    .arena::after { right: 12px; bottom: 12px; border-right: 1px solid; border-bottom: 1px solid; }

    .arena-hint {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #777970;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }

    .arena-hint strong { display: block; margin-bottom: 7px; color: var(--ink); font-size: 20px; }

    .target {
      position: absolute;
      z-index: 1;
      width: clamp(62px, 10vw, 78px);
      aspect-ratio: 1;
      padding: 0;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 4px 4px 0 var(--ink);
      color: var(--ink);
      cursor: crosshair;
      transform: translate(-50%, -50%);
      animation: appear .16s ease-out both;
      touch-action: manipulation;
    }

    .target::before, .target::after {
      position: absolute;
      top: 50%;
      left: 50%;
      content: "";
      background: var(--ink);
      transform: translate(-50%, -50%);
    }
    .target::before { width: 31px; height: 2px; }
    .target::after { width: 2px; height: 31px; }
    .target:hover { background: var(--lime); }
    .target:active { box-shadow: 1px 1px 0 var(--ink); }
    .target[hidden], .arena-hint[hidden] { display: none; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 0 0;
    }

    .actions { display: flex; gap: 9px; }
    .action {
      min-height: 46px;
      padding: 0 19px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .14s ease, background .14s ease;
    }
    .action:hover { transform: translateY(-2px); }
    .action:focus-visible, .target:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .action-primary { background: var(--lime); }
    .action-primary:hover { background: #c3f12e; }
    .instructions { margin: 0; color: var(--muted); font-size: 13px; }
    .instructions strong { color: var(--ink); }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-top: 17px;
      margin-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    @keyframes appear { from { opacity: 0; scale: .72; } to { opacity: 1; scale: 1; } }

    @media (max-width: 600px) {
      .page { padding-top: 18px; padding-bottom: 16px; }
      .intro { align-items: start; flex-direction: column; gap: 10px; padding-top: 25px; }
      .intro-note { max-width: 310px; }
      .stat { min-height: 72px; padding: 12px 10px; }
      .stat-value { font-size: 27px; }
      .arena { min-height: 300px; margin-top: 10px; }
      .controls { align-items: stretch; flex-direction: column; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; }
      .action { padding: 0 10px; }
      .instructions { line-height: 1.5; }
      footer { margin-top: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>快手俱樂部</div>
      <span class="edition">反應力挑戰 / 01</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="title">
        <div>
          <p class="eyebrow">READY, SET, TAP</p>
          <h1 id="title">手速測驗</h1>
        </div>
        <p class="intro-note">盯緊目標，趁它消失前點下去。30 秒內，看看你的手速能拿幾分。</p>
      </section>

      <section class="scoreboard" aria-label="遊戲分數">
        <div class="stat"><span class="stat-label">分數 / SCORE</span><span class="stat-value" id="score">00</span></div>
        <div class="stat"><span class="stat-label">最高紀錄 / BEST</span><span class="stat-value" id="best">00</span></div>
        <div class="stat"><span class="stat-label">剩餘時間 / TIME</span><span class="stat-value"><span id="time">30</span><span aria-hidden="true">s</span></span></div>
      </section>

      <section class="arena" id="arena" aria-label="遊戲區">
        <div class="arena-hint" id="hint"><div><strong>準備好了嗎？</strong>按下開始，目標就會出現。</div></div>
        <button class="target" id="target" type="button" aria-label="點擊目標加分" hidden></button>
      </section>

      <section class="controls" aria-label="遊戲控制">
        <div class="actions">
          <button class="action action-primary" id="start" type="button">開始挑戰</button>
          <button class="action" id="restart" type="button">重新開始</button>
        </div>
        <p class="instructions"><strong>玩法</strong>　點擊或輕觸紅色目標，每命中一次加 1 分。時間歸零就結算！</p>
      </section>
    </main>

    <footer><span>一場 30 秒的專注練習</span><span>NO ADS · JUST REFLEXES</span></footer>
  </div>

  <script>
    const arena = document.querySelector("#arena");
    const target = document.querySelector("#target");
    const hint = document.querySelector("#hint");
    const scoreDisplay = document.querySelector("#score");
    const bestDisplay = document.querySelector("#best");
    const timeDisplay = document.querySelector("#time");
    const startButton = document.querySelector("#start");
    const restartButton = document.querySelector("#restart");

    let score = 0;
    let secondsLeft = 30;
    let timerId = null;
    let isPlaying = false;
    let bestScore = Number.parseInt(localStorage.getItem("quickHandsBest") || "0", 10);
    bestDisplay.textContent = String(bestScore).padStart(2, "0");

    function placeTarget() {
      const targetRadius = target.offsetWidth / 2 + 12;
      const usableWidth = Math.max(0, arena.clientWidth - targetRadius * 2);
      const usableHeight = Math.max(0, arena.clientHeight - targetRadius * 2);
      target.style.left = `${targetRadius + Math.random() * usableWidth}px`;
      target.style.top = `${targetRadius + Math.random() * usableHeight}px`;
    }

    function finishGame() {
      isPlaying = false;
      window.clearInterval(timerId);
      timerId = null;
      target.hidden = true;
      hint.hidden = false;
      hint.innerHTML = `<div><strong>時間到！你的分數是 ${score} 分</strong>按下重新開始，再挑戰一次。</div>`;
      startButton.textContent = "再玩一次";
    }

    function startGame() {
      window.clearInterval(timerId);
      score = 0;
      secondsLeft = 30;
      isPlaying = true;
      scoreDisplay.textContent = "00";
      timeDisplay.textContent = "30";
      hint.hidden = true;
      target.hidden = false;
      startButton.textContent = "挑戰進行中";
      placeTarget();

      timerId = window.setInterval(() => {
        secondsLeft -= 1;
        timeDisplay.textContent = String(secondsLeft).padStart(2, "0");
        if (secondsLeft <= 0) finishGame();
      }, 1000);
    }

    target.addEventListener("click", () => {
      if (!isPlaying) return;
      score += 1;
      scoreDisplay.textContent = String(score).padStart(2, "0");
      if (score > bestScore) {
        bestScore = score;
        bestDisplay.textContent = String(bestScore).padStart(2, "0");
        localStorage.setItem("quickHandsBest", String(bestScore));
      }
      placeTarget();
    });

    startButton.addEventListener("click", startGame);
    restartButton.addEventListener("click", startGame);
    window.addEventListener("resize", () => {
      if (isPlaying) placeTarget();
    });
  </script>
</body>
</html>
